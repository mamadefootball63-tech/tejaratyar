<!DOCTYPE html><html lang="fa" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TejaratYar v3</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>تجارت‌یار v3</h1></header>
<div id="login">
<input id="u" placeholder="نام کاربری"><input id="p" type="password" placeholder="رمز">
<button onclick="login()">ورود</button></div>
<div id="app" style="display:none">
<nav>
<button onclick="showTab('dashboard')">داشبورد</button>
<button onclick="showTab('products')">کالاها</button>
<button onclick="showTab('customers')">مشتریان</button>
<button onclick="showTab('invoices')">فاکتورها</button>
</nav>
<section id="dashboard"><h2>داشبورد</h2><p>کالاها: <span id="pc"></span></p><p>مشتریان: <span id="cc"></span></p></section>
<section id="products" class="hidden"><h2>کالاها</h2>
<input id="pn" placeholder="نام کالا"><input id="pp" type="number" placeholder="قیمت فروش">
<button onclick="addProduct()">افزودن</button><ul id="plist"></ul></section>
<section id="customers" class="hidden"><h2>مشتریان</h2>
<input id="cn" placeholder="نام مشتری"><button onclick="addCustomer()">افزودن</button><ul id="clist"></ul></section>
<section id="invoices" class="hidden"><h2>فاکتور</h2>
<input id="iname" placeholder="شرح فاکتور"><input id="iamount" type="number" placeholder="مبلغ">
<button onclick="addInvoice()">ثبت فاکتور</button><ul id="ilist"></ul></section>
</div><script src="app.js"></script></body></html>
