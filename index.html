<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TejaratYar v4</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>تجارت‌یار v4</h1>
</header>

<div id="login">
<input id="u" placeholder="نام کاربری">
<input id="p" type="password" placeholder="رمز عبور">
<button onclick="login()">ورود</button>
</div>

<div id="app" style="display:none">

<nav>
<button onclick="showTab('dashboard')">داشبورد</button>
<button onclick="showTab('products')">کالاها</button>
<button onclick="showTab('customers')">مشتریان</button>
<button onclick="showTab('invoices')">فاکتورها</button>
</nav>

<section id="dashboard">
<h2>داشبورد</h2>

<div class="stats">

<div class="stat">
<h3>کالاها</h3>
<p id="pc">0</p>
</div>

<div class="stat">
<h3>مشتریان</h3>
<p id="cc">0</p>
</div>

<div class="stat">
<h3>فاکتورها</h3>
<p id="ic">0</p>
</div>

</div>

</section>

<section id="products" class="hidden">
<h2>کالاها</h2>

<input id="pn" placeholder="نام کالا">

<input id="pp"
type="number"
placeholder="قیمت کالا">

<input id="pq"
type="number"
placeholder="موجودی">

<button onclick="addProduct()">
افزودن کالا
</button>

<ul id="plist"></ul>

</section>

<section id="customers" class="hidden">
<h2>مشتریان</h2>

<input id="cn" placeholder="نام مشتری">

<button onclick="addCustomer()">
افزودن مشتری
</button>

<ul id="clist"></ul>

</section>

<section id="invoices" class="hidden">
<h2>فاکتورها</h2>

<input id="iname" placeholder="شرح فاکتور">

<button onclick="addInvoice()">
ثبت فاکتور
</button>

<ul id="ilist"></ul>

</section>

</div>

<script src="app.js"></script>

</body>
</html>
